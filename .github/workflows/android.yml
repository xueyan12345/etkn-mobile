name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Test, lint and build (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.unsigned.outputs.artifact-id }}
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Resolve version
        id: version
        shell: bash
        run: |
          base=$(sed -n 's/^val baseVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF#refs/tags/v}"; else name="$base"; fi
          [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid version $name" >&2; exit 1; }
          code=$(( 1000 + GITHUB_RUN_NUMBER ))
          printf 'name=%s\ncode=%s\n' "$name" "$code" >> "$GITHUB_OUTPUT"
      - name: Restore Blu-ray native library
        id: bluray
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: app/src/main/jniLibs
          key: bluray-r27c-${{ hashFiles('scripts/build_bluray_native.py', 'third_party/bluray/**', 'third_party/dovi/**') }}
      - name: Build Blu-ray native library (pinned, checksum-verified sources; NDK r27c)
        if: steps.bluray.outputs.cache-hit != 'true'
        shell: bash
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          rustc --version
          python3 scripts/build_bluray_native.py --ndk "$ANDROID_HOME/ndk/27.2.12479018" --work "$RUNNER_TEMP/bluray" --out app/src/main/jniLibs
      - name: Unit tests, lint, release build (no signing credentials in this job)
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          unset ETKN_KEYSTORE_FILE ETKN_KEYSTORE_PASSWORD ETKN_KEY_ALIAS ETKN_KEY_PASSWORD
          ./gradlew --console=plain --stacktrace \
            "-PetknVersionName=$VERSION_NAME" "-PetknVersionCode=$VERSION_CODE" \
            :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
          mkdir -p "$RUNNER_TEMP/unsigned"
          find app/build/outputs/apk/release -name '*-release-unsigned.apk' -exec install -m 0644 {} "$RUNNER_TEMP/unsigned/" \;
          mpv_aar=$(find "$HOME/.gradle/caches" -name 'mpv-android-*.aar' -print -quit)
          test -n "$mpv_aar" || { echo "mpv-android AAR not found in the Gradle cache" >&2; exit 1; }
          for apk in "$RUNNER_TEMP"/unsigned/*.apk; do
            unzip -l "$apk" | grep -q 'libetkn_bluray.so' || { echo "libetkn_bluray.so missing in $apk" >&2; exit 1; }
            # FFmpeg is shared by libmpv and NextLib: the packaged copy must be mpv's full build.
            for abi in $(unzip -Z1 "$apk" 'lib/*/libmpv.so' | cut -d/ -f2); do
              packaged=$(unzip -p "$apk" "lib/$abi/libavcodec.so" | sha256sum | cut -d' ' -f1)
              expected=$(unzip -p "$mpv_aar" "jni/$abi/libavcodec.so" | sha256sum | cut -d' ' -f1)
              test "$packaged" = "$expected" || { echo "$apk $abi: libavcodec.so is not mpv's copy" >&2; exit 1; }
              echo "$(basename "$apk") $abi: libmpv + mpv FFmpeg"
            done
            unzip -Z1 "$apk" 'lib/*/libmpv.so' > /dev/null || { echo "libmpv.so missing in $apk" >&2; exit 1; }
            if unzip -Z1 "$apk" 'lib/x86/*' > /dev/null 2>&1; then echo "32-bit x86 libraries in $apk" >&2; exit 1; fi
          done
          ls -la "$RUNNER_TEMP/unsigned"
      - name: Lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report-${{ github.run_attempt }}
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Hand off unsigned APKs
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unsigned/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    name: Sign with the fixed release key
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      artifact: ${{ steps.signed.outputs.artifact-id }}
    steps:
      # Fresh runner: no checkout, no Gradle, no cache in the job that sees the key.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/unsigned
          merge-multiple: true
      - name: Sign and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.ETKN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ETKN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ETKN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ETKN_KEY_PASSWORD }}
          SIGNER_SHA256: ${{ secrets.ETKN_SIGNER_SHA256 }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        shell: bash
        run: |
          : "${KEYSTORE_BASE64:?Missing ETKN_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing ETKN_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing ETKN_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing ETKN_KEY_PASSWORD}"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/key.XXXXXXXX")
          trap 'rm -f -- "$keydir/release.p12"; rmdir -- "$keydir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keydir/release.p12"
          unset KEYSTORE_BASE64
          expected=$(printf '%s' "$SIGNER_SHA256" | tr -d ' :\r\n' | tr 'A-F' 'a-f')
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]] || { echo "ETKN_SIGNER_SHA256 must be a 64-hex certificate digest" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/signed"
          for apk in "$RUNNER_TEMP"/unsigned/*-release-unsigned.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release-unsigned\.apk$/\1/')
            out="$RUNNER_TEMP/signed/ETKN-Mobile-$VERSION_NAME-$abi.apk"
            "$tools/zipalign" -c -P 16 4 "$apk" >/dev/null || { "$tools/zipalign" -f -P 16 4 "$apk" "$apk.aligned"; mv "$apk.aligned" "$apk"; }
            "$tools/apksigner" sign --ks "$keydir/release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --v4-signing-enabled false --out "$out" "$apk"
            result=$("$tools/apksigner" verify --print-certs "$out")
            cert=$(printf '%s\n' "$result" | grep -iE 'certificate SHA-256 digest' | head -1 | awk '{print tolower($NF)}' | tr -d ' :\r\n')
            if [[ "$cert" != "$expected" ]]; then
              echo "Signer mismatch for $(basename "$out")" >&2
              printf '%s\n' "$result" | grep -iE 'certificate (DN|SHA-256)' >&2 || printf '%s\n' "$result" | head -5 >&2
              echo "expected prefix ${expected:0:12} (${#expected} chars), got prefix ${cert:0:12} (${#cert} chars)" >&2
              exit 1
            fi
          done
          (cd "$RUNNER_TEMP/signed" && sha256sum *.apk | tee SHA256SUMS.txt)
      - name: Signed APKs
        id: signed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ETKN-Mobile-${{ needs.build.outputs.version_name }}-${{ needs.build.outputs.version_code }}
          path: ${{ runner.temp }}/signed/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [build, sign]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # 用户口径（2026-11-23）：更新日志必须显示实际改动，不能用 --generate-notes
          # （它只生成一条 compare 链接，把 tag 上写的说明覆盖掉，App 弹窗里就是空的）。
          # 有 release_notes_<tag>.md 就用它当正文；没有才退回自动生成的链接。
          NOTES="release_notes_${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" "$RUNNER_TEMP"/release/* \
              --repo "$GITHUB_REPOSITORY" --title "ETKN Mobile $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$RUNNER_TEMP"/release/* \
              --repo "$GITHUB_REPOSITORY" --title "ETKN Mobile $TAG" --generate-notes
          fi
